name: Build and deploy shinylive app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        shell: Rscript {0}
        run: install.packages(c("shinylive", "shiny", "bslib", "DT"))

      - name: Export shinylive app
        shell: Rscript {0}
        run: shinylive::export("app", "_site")

      - name: Inject PWA (manifest + service worker)
        shell: Rscript {0}
        run: if (file.exists("pwa/inject.R")) source("pwa/inject.R")

      - name: Debug - list built files
        run: |
          echo "==== _site tree ===="
          find _site -maxdepth 2 | sort
          test -f _site/index.html && echo "RESULT: index.html IS at _site root" || echo "RESULT: index.html MISSING at _site root"
          find _site -maxdepth 2 | sort > _site/debug.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
